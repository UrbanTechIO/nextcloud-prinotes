name: prinotes
description: PriNotes — Rich note-taking app with Nextcloud sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Local database
  drift: ^2.18.0
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.22

  # HTTP & networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.3

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3

  # Background sync
  workmanager: ^0.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # UI & navigation
  go_router: ^14.2.7
  flutter_colorpicker: ^1.1.0
  intl: ^0.20.2

  # Rich text editor
  flutter_quill: ^11.5.0

  # Image handling
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Export
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^12.0.2

  # Storage
  path_provider: ^2.1.4
  path: ^1.9.0

  # Misc
  uuid: ^4.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
